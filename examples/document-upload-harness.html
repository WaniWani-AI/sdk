<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Waniwani document upload harness</title>
		<style>
			body {
				font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
				margin: 0;
				padding: 24px;
				background: #faf9f7;
				color: #1c1917;
			}
			h1 {
				font-size: 16px;
				margin: 0 0 4px;
			}
			p {
				margin: 0 0 16px;
				color: #57534e;
			}
			#log {
				font: 12px/1.6 ui-monospace, monospace;
				background: #fff;
				border: 1px dashed #d6d3d1;
				border-radius: 8px;
				padding: 12px;
				height: 220px;
				overflow: auto;
				white-space: pre-wrap;
			}
			.row {
				display: flex;
				gap: 8px;
				margin-bottom: 12px;
				flex-wrap: wrap;
			}
			button {
				font: inherit;
				padding: 6px 10px;
				border: 1px solid #d6d3d1;
				border-radius: 6px;
				background: #fff;
				cursor: pointer;
			}
			[data-waniwani-embed] {
				height: 520px;
				border: 1px dashed #d6d3d1;
				border-radius: 12px;
				background: #fff;
				margin-top: 16px;
			}
		</style>
	</head>
	<body>
		<h1>Document upload, end to end</h1>
		<p>
			The real embed, pointed at a running app. Pass your environment's public key as
			<code>?token=wwp_&hellip;</code>. Every request the widget makes is logged below, so an upload
			that never happens is as visible as one that does.
		</p>

		<div class="row">
			<button id="state">read composer state</button>
			<button id="pdf">attach 1 PDF (picker-free)</button>
			<button id="eleven">attach 11 PDFs (cap is 10)</button>
			<button id="big">attach a 60 MB PDF (cap is 50)</button>
			<button id="png">attach a wide PNG (300x120)</button>
			<button id="heic">attach a .heic (not accepted)</button>
			<button id="paste">paste a PDF</button>
			<button id="racesubmit">attach then submit immediately</button>
			<button id="raceremove">attach then remove mid-upload</button>
			<button id="clear">clear log</button>
		</div>

		<div id="log"></div>
		<div data-waniwani-embed></div>

		<script>
			const logEl = document.getElementById("log");
			const log = (...a) => {
				logEl.textContent += a.join(" ") + "\n";
				logEl.scrollTop = logEl.scrollHeight;
			};
			window.addEventListener("error", (e) => log("PAGE ERROR:", e.message));
			window.addEventListener("unhandledrejection", (e) => log("UNHANDLED:", String(e.reason)));

			// Log every call the widget makes, without changing what it does.
			const realFetch = window.fetch;
			window.fetch = async (input, init) => {
				const url = typeof input === "string" ? input : input.url;
				const method = init?.method ?? "GET";
				const started = performance.now();
				try {
					const res = await realFetch(input, init);
					log(`fetch ${method} ${short(url)} -> ${res.status} (${ms(started)})`);
					return res;
				} catch (err) {
					log(`fetch ${method} ${short(url)} -> THREW ${err} (${ms(started)})`);
					throw err;
				}
			};
			const RealXHR = window.XMLHttpRequest;
			window.XMLHttpRequest = function () {
				const xhr = new RealXHR();
				const open = xhr.open;
				let m = "";
				let u = "";
				xhr.open = function (method, url, ...rest) {
					m = method;
					u = url;
					return open.call(this, method, url, ...rest);
				};
				xhr.addEventListener("loadend", () =>
					log(`xhr ${m} ${short(u)} -> ${xhr.status}${xhr.status === 0 ? " (blocked/aborted)" : ""}`)
				);
				return xhr;
			};
			const short = (u) => String(u).replace(/^https?:\/\/[^/]+/, "").split("?")[0].slice(0, 72);
			const ms = (t) => `${(performance.now() - t).toFixed(0)}ms`;

			const pdf = (name, bytes = 2048) => {
				const b = new Uint8Array(bytes);
				b.set(new TextEncoder().encode("%PDF-1.7\n"));
				return new File([b], name, { type: "application/pdf" });
			};

			// The widget renders into a shadow root, so every query has to go through it.
			const root = () =>
				[...document.querySelectorAll("*")].find((e) => e.shadowRoot)?.shadowRoot;
			const q = (sel) => root()?.querySelector(sel);
			const qa = (sel) => [...(root()?.querySelectorAll(sel) ?? [])];
			const input = () => q('input[type="file"]');
			const drop = (files) => {
				const el = input();
				if (!el) return log("no file input found; is the paperclip rendered?");
				const dt = new DataTransfer();
				for (const f of files) dt.items.add(f);
				el.files = dt.files;
				el.dispatchEvent(new Event("change", { bubbles: true }));
				log(`attached ${files.length} file(s)`);
			};

			document.getElementById("pdf").onclick = () => drop([pdf("quote.pdf")]);
			document.getElementById("eleven").onclick = () =>
				drop(Array.from({ length: 11 }, (_, i) => pdf(`scan-${i + 1}.pdf`)));
			document.getElementById("big").onclick = () => drop([pdf("huge.pdf", 60 * 1024 * 1024)]);
			document.getElementById("png").onclick = async () => {
				const c = document.createElement("canvas");
				c.width = 300;
				c.height = 120;
				const g = c.getContext("2d");
				g.fillStyle = "#04D916";
				g.fillRect(0, 0, 300, 120);
				g.fillStyle = "#0b1a0b";
				g.font = "bold 28px system-ui";
				g.fillText("300 x 120", 70, 70);
				const blob = await new Promise((r) => c.toBlob(r, "image/png"));
				drop([new File([blob], "wide-banner.png", { type: "image/png" })]);
			};
			document.getElementById("heic").onclick = () =>
				drop([new File([new Uint8Array(64)], "photo.heic", { type: "image/heic" })]);
			document.getElementById("paste").onclick = () => {
				const ta = q("textarea");
				if (!ta) return log("no textarea");
				const dt = new DataTransfer();
				dt.items.add(pdf("pasted.pdf"));
				ta.dispatchEvent(new ClipboardEvent("paste", { clipboardData: dt, bubbles: true }));
				log("pasted a PDF");
			};
			document.getElementById("racesubmit").onclick = () => {
				drop([pdf("racing.pdf", 512 * 1024)]);
				const ta = q("textarea");
				const form = ta?.closest("form");
				if (ta) {
					const setter = Object.getOwnPropertyDescriptor(
						window.HTMLTextAreaElement.prototype,
						"value"
					).set;
					setter.call(ta, "what does this say?");
					ta.dispatchEvent(new Event("input", { bubbles: true }));
				}
				log("submitting while the upload is still in flight");
				form?.requestSubmit();
			};
			document.getElementById("raceremove").onclick = () => {
				drop([pdf("doomed.pdf", 512 * 1024)]);
				setTimeout(() => {
					const x = qa("button").find(
						(b) => b.getAttribute("aria-label")?.toLowerCase().includes("remove")
					);
					log(x ? "removing mid-upload" : "no remove control found");
					x?.click();
				}, 30);
			};
			document.getElementById("state").onclick = () => {
				const el = input();
				log(
					`paperclip=${qa("button").length > 1 ? "yes" : "no"}  accept=${el?.getAttribute("accept") ?? "(none)"}  chips=${qa("[data-chip], span").filter((s) => s.textContent?.endsWith(".pdf")).length}`
				);
			};
			document.getElementById("clear").onclick = () => {
				logEl.textContent = "";
			};
		</script>

		<script>
			// Point this at your own environment:
			//   ?token=wwp_…&api=http://localhost:3000/api/mcp/chat
			// A static file server that rewrites /x.html to /x drops the query but keeps
			// the hash, so both carry the token.
			const params = new URLSearchParams(
				location.search || location.hash.replace(/^#/, "?")
			);
			const token = params.get("token");
			const api = params.get("api") ?? "http://localhost:3000/api/mcp/chat";
			if (token) {
				const s = document.createElement("script");
				s.src = "/dist/chat/embed.js";
				s.dataset.token = token;
				s.dataset.api = api;
				s.dataset.mode = "inline";
				document.body.appendChild(s);
			} else {
				log("no ?token=wwp_… in the URL, so no widget was loaded.");
			}
		</script>
	</body>
</html>
