name: Release to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - beta
          - alpha

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check manual release requirements
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::RELEASE_TOKEN secret is not set. Add an admin fine-grained PAT as a repo secret."
            exit 1
          fi
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [[ "$PERMISSION" != "admin" ]]; then
            echo "::error::Only admins can trigger manual releases"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/checkout@v6
        with:
          token: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Flow eval against the last release
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          else
            # A manual release already ran the eval before it pushed this tag.
            if [[ "$(git log -1 --format=%ae)" == "github-actions[bot]@users.noreply.github.com" ]]; then
              echo "::notice::Tag pushed by a manual release, the eval already ran there"
              exit 0
            fi
            PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          fi
          if git diff --quiet "$PREV" HEAD -- src/mcp/server/flows/; then
            echo "::notice::No changes in src/mcp/server/flows/ since $PREV, skipping the flow eval"
            exit 0
          fi
          if [[ -z "$AI_GATEWAY_API_KEY" ]]; then
            echo "::error::src/mcp/server/flows/ changed since $PREV, and the flow eval needs the AI_GATEWAY_API_KEY repo secret."
            exit 1
          fi
          set +e
          bun run eval:flows --sdk "local,${PREV#v}" --fail-on-regression 2>&1 | tee eval.log
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "### Flow eval: this release against $PREV"
            echo '```'
            cat eval.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
        env:
          EVENT: ${{ github.event_name }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: Bump version and create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BUMP="${{ inputs.bump }}"
          if [[ "$BUMP" == "beta" ]]; then
            npm version prerelease --preid beta
          elif [[ "$BUMP" == "alpha" ]]; then
            npm version prerelease --preid alpha
          else
            npm version "$BUMP"
          fi
          git push --follow-tags

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          else
            echo "value=$TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ github.ref_name }}

      - run: bun run build

      - name: Determine release channel
        id: channel
        run: |
          if [[ "$TAG" == *"alpha"* ]]; then
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"beta"* ]]; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.tag.outputs.value }}

      - name: Check if already published
        id: check
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "@waniwani/sdk@$VERSION" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already published to npm, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --tag ${{ steps.channel.outputs.npm_tag }} --provenance --ignore-scripts

      # No CDN purge step: the chat embed is served via the app.waniwani.ai/embed.js
      # loader, which resolves the latest version server-side (short-cached) and
      # injects an immutable version-pinned bundle. Customers never load a mutable
      # `@latest/*` CDN URL, so there is nothing to purge on release. See the
      # embed loader docs in the app repo.

      - name: Create GitHub Release
        if: steps.check.outputs.published == 'false'
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
