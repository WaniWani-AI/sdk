name: Release to npm

# `bun run release:<bump>` in packages/sdk pushes a `v*` tag, and in
# packages/chat a `chat-v*` tag (scripts/bump.ts). The tag picks the package.
on:
  push:
    tags:
      - "v*"
      - "chat-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        required: true
        type: choice
        options:
          - sdk
          - chat
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - beta
          - alpha

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check manual release requirements
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::RELEASE_TOKEN secret is not set. Add an admin fine-grained PAT as a repo secret."
            exit 1
          fi
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [[ "$PERMISSION" != "admin" ]]; then
            echo "::error::Only admins can trigger manual releases"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/checkout@v6
        with:
          token: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Resolve the package
        id: pkg
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            NAME="$INPUT"
          elif [[ "$REF" == chat-v* ]]; then
            NAME=chat
          else
            NAME=sdk
          fi
          if [[ "$NAME" == "chat" ]]; then PREFIX="chat-v"; else PREFIX="v"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$NAME" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.package }}
          REF: ${{ github.ref_name }}

      # The flow eval gates @waniwani/sdk only. The chat has no eval yet.
      - name: Flow eval against the last release
        if: steps.pkg.outputs.name == 'sdk'
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          else
            # A manual release already ran the eval before it pushed this tag.
            if [[ "$(git log -1 --format=%ae)" == "github-actions[bot]@users.noreply.github.com" ]]; then
              echo "::notice::Tag pushed by a manual release, the eval already ran there"
              exit 0
            fi
            PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          fi
          if [[ -z "$AI_GATEWAY_API_KEY" ]]; then
            echo "::error::The flow eval needs the AI_GATEWAY_API_KEY secret."
            exit 1
          fi
          set +e
          bun run eval:flows --sdk "local,${PREV#v}" --fail-on-regression 2>&1 | tee eval.log
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "### Flow eval: this release against $PREV"
            echo '```'
            cat eval.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
        env:
          EVENT: ${{ github.event_name }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: Bump version and create tag
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bun run "release:$BUMP"
        env:
          BUMP: ${{ inputs.bump }}

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${PREFIX}$(jq -r .version "$DIR/package.json")" >> "$GITHUB_OUTPUT"
          else
            echo "value=$TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ github.ref_name }}
          DIR: ${{ steps.pkg.outputs.dir }}
          PREFIX: ${{ steps.pkg.outputs.prefix }}

      # Builds both packages: the SDK build copies the chat's embed.js.
      - run: bun run build

      - name: Determine release channel
        id: channel
        run: |
          if [[ "$TAG" == *"alpha"* ]]; then
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"beta"* ]]; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.tag.outputs.value }}

      - name: Check if already published
        id: check
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          if npm view "$NAME@$VERSION" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already published to npm, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --tag ${{ steps.channel.outputs.npm_tag }} --provenance --ignore-scripts
        env:
          # Trusted publishing (OIDC) covers every package with a trusted
          # publisher on npmjs.com. NPM_TOKEN is only for a package that has
          # none yet: npm cannot attach one before the first publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # No CDN purge step: the chat embed is served via the app.waniwani.ai/embed.js
      # loader, which resolves the latest version server-side (short-cached) and
      # injects an immutable version-pinned bundle. Customers never load a mutable
      # `@latest/*` CDN URL, so there is nothing to purge on release. See the
      # embed loader docs in the app repo.

      - name: Create GitHub Release
        if: steps.check.outputs.published == 'false'
        run: |
          # Notes start at this package's previous tag, not the other package's.
          PREV=$(git describe --tags --abbrev=0 --match "${PREFIX}*" "$TAG^" 2>/dev/null || true)
          ARGS=(--generate-notes)
          if [[ -n "$PREV" ]]; then ARGS+=(--notes-start-tag "$PREV"); fi
          if [[ "$PRERELEASE" == "true" ]]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "${ARGS[@]}"
        env:
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          PREFIX: ${{ steps.pkg.outputs.prefix }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
