name: Release

# Changesets drives every release (https://changesets.dev). A PR that changes a
# published package adds a changeset with `bun changeset`. On each push to main
# (or beta), select-mode picks one of three paths:
#
# - version: the branch has changesets. The version job opens or updates the
#   "Version Packages" PR, which bumps the versions, writes each package's
#   CHANGELOG.md and refreshes bun.lock. Merging that PR is the release.
# - publish: the branch has no changesets, and a package has a version that npm
#   does not have yet (the push that merged the Version Packages PR). The pack
#   job builds and packs it, the flow eval gates it, and the publish job
#   publishes it, tags it (`@waniwani/sdk@1.2.3`) and creates the GitHub release.
# - none: nothing to do.
#
# The beta branch runs in Changesets pre mode (`bun changeset pre enter beta`),
# so its releases are `1.3.0-beta.0`, `-beta.1` and so on, under the beta
# dist-tag. See .changeset/README.md.
#
# A manual run publishes a snapshot of the selected branch under the beta or
# alpha dist-tag, for example `@waniwani/sdk@1.3.0-beta-20261105101500`. The
# branch needs at least one changeset.
#
# npm trusts this workflow by file name (trusted publishing). Renaming the file
# breaks publishing until the trusted publisher of both packages is updated on
# npmjs.com.
#
# Only the two publish jobs get `id-token: write`, and neither runs a build: they
# publish tarballs packed by a job that has no publish rights.
#
# No CDN purge step: the chat embed is served via the app.waniwani.ai/embed.js
# loader, which resolves the latest version server-side and injects an
# immutable version-pinned bundle.

on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag for a snapshot of the selected branch"
        required: true
        type: choice
        options:
          - beta
          - alpha

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # RELEASE_TOKEN (a fine-grained PAT with contents and pull requests write)
      # pushes the PR branch: GitHub starts no workflows for a PR that
      # GITHUB_TOKEN opens, and ci.yml must run on this one.
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: bun run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Builds both packages, the same command as CI.
      - run: bun run build

      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # The release gate for @waniwani/sdk. When this publish contains an SDK
  # version, it runs the flow eval of this commit against the SDK on npm's
  # latest tag. The publish job waits for it, so a regression publishes
  # nothing, the chat included.
  flow-eval:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Flow eval against the last release
        run: |
          VERSION=$(jq -r .version packages/sdk/package.json)
          if [[ -n "$(npm view "@waniwani/sdk@$VERSION" version 2>/dev/null)" ]]; then
            echo "::notice::npm already has @waniwani/sdk@$VERSION, so this publish has no SDK release and the eval does not run"
            exit 0
          fi
          if [[ -z "$AI_GATEWAY_API_KEY" ]]; then
            echo "::error::The flow eval needs the AI_GATEWAY_API_KEY secret."
            exit 1
          fi
          PREV=$(npm view @waniwani/sdk version)
          set +e
          bun run eval:flows --sdk "local,$PREV" --fail-on-regression 2>&1 | tee eval.log
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "### Flow eval: @waniwani/sdk $VERSION against $PREV"
            echo '```'
            cat eval.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

  publish:
    needs: [pack, flow-eval]
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tags and GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Trusted publishing (OIDC) covers every package with a trusted
          # publisher on npmjs.com. NPM_TOKEN is only for a package that has
          # none yet: npm cannot attach one before the first publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  snapshot-pack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Only admins publish snapshots
        run: |
          PERMISSION=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission')
          if [[ "$PERMISSION" != "admin" ]]; then
            echo "::error::Only admins can publish a snapshot"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Fails with "No unreleased changesets found" when the branch has none.
      # GITHUB_TOKEN lets @changesets/changelog-github look up each changeset's PR.
      - run: bun changeset version --snapshot "$TAG"
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}

      - run: bun run build

      # `changeset pack` would write the `latest` dist-tag into its publish
      # plan, so the snapshot packs with npm and publishes with an explicit tag.
      - name: Pack the snapshot packages
        run: |
          mkdir -p snapshot
          for dir in packages/*/; do
            if [[ "$(jq -r .version "$dir/package.json")" == *"-$TAG-"* ]]; then
              npm pack "./$dir" --pack-destination snapshot
            fi
          done
        env:
          TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-packages
          path: snapshot/*.tgz
          if-no-files-found: error
          retention-days: 1

  snapshot-publish:
    needs: snapshot-pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          name: snapshot-packages
          path: snapshot

      - name: Publish the snapshot
        run: |
          echo "### Snapshot published under \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          for tarball in snapshot/*.tgz; do
            npm publish "$tarball" --access public --tag "$TAG" --provenance
            SPEC=$(tar -xzOf "$tarball" package/package.json | jq -r '.name + "@" + .version')
            echo "- \`npm install $SPEC\`" >> "$GITHUB_STEP_SUMMARY"
          done
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
