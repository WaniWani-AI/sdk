name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # The action scans `<start>^..<head>`, and by default <start> is the
          # oldest new commit. When a change merges in another repo's history,
          # that commit is a root commit with no parent, and git refuses the
          # range. BASE_REF sets <start> to the pull request's base, or on a push
          # to the branch tip before the push, which always has a parent. The
          # scan then also reads that one commit, which an earlier run scanned.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
